name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild every morning so prompts dated "today" appear even without a new push.
  schedule:
    - cron: "10 1 * * *" # 06:10 Tashkent

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Check server settings
        id: check
        env:
          HAS_HOST: ${{ secrets.SSH_HOST != '' }}
          HAS_KEY: ${{ secrets.SSH_KEY != '' }}
        run: |
          if [ "$HAS_HOST" != "true" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::warning::SSH_HOST / SSH_KEY secrets are not set yet — site built but not deployed. See README."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to server
        if: steps.check.outputs.ready == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'deploy' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            dist/ "$SSH_USER@$SSH_HOST:/var/www/promt/"
          echo "Deployed to $SSH_HOST"
